[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gigle-ai"
version = "0.1.0"
description = "A Python wrapper for Google's Gemini AI API with a convenient CLI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
gigle-ai = "gigle_ai.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gigle_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
